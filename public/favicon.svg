<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#8ec5ff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(145,94,255,0.35)" stroke-width="1"/>
  <!-- < chevron -->
  <path d="M9 10 L4.5 16 L9 22" stroke="url(#grad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- / slash -->
  <path d="M19 8.5 L13 23.5" stroke="url(#grad)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- > chevron -->
  <path d="M23 10 L27.5 16 L23 22" stroke="url(#grad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
